<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CyberAudit">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e6ad"/>
      <stop offset="1" stop-color="#00b487"/>
    </linearGradient>
  </defs>

  <!-- tile de fundo -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13.75" fill="none" stroke="#1c2a3a" stroke-width="1.5"/>

  <!-- brilho suave -->
  <circle cx="32" cy="31" r="21" fill="#00d4a0" opacity="0.14"/>

  <!-- ◈ losango externo (marca CyberAudit) -->
  <path d="M32 8 L56 32 L32 56 L8 32 Z" fill="url(#teal)"/>
  <!-- recorte interno -->
  <path d="M32 21 L43 32 L32 43 L21 32 Z" fill="url(#tile)"/>
  <!-- ponto central -->
  <circle cx="32" cy="32" r="4.6" fill="url(#teal)"/>
</svg>
