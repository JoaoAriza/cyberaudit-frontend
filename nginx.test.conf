# Config mínima pro Dockerfile de teste (cyberaudit-qa) — SPA: qualquer rota
# não encontrada cai em index.html, o React Router (client-side) decide o resto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
