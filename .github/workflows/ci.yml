name: CI

# Type-check, testes e build a cada push na main e em todo PR. O `build` roda o
# `tsc -b` antes do Vite, então um erro de tipo derruba o CI mesmo sem teste.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Type-check, test & build (Node 22)
    runs-on: ubuntu-latest
    # O vite.config (assertApiUrl) exige VITE_API_URL no build de produção. Local
    # vem do .env.production, que é gitignored — então o CI não o tem. É valor
    # PÚBLICO (toda VITE_* vai para o bundle do cliente), por isso fica direto aqui;
    # o build real do Cloudflare Pages usa a env var dele.
    env:
      VITE_API_URL: https://api.cyberauditapp.com
    steps:
      - uses: actions/checkout@v4

      # Node 22: o Vite 7 exige ^20.19 || >=22.12. O "20" genérico resolvia um
      # 20.x abaixo de 20.19 no runner e o `vite build` morria na hora. 22 é a
      # versão de desenvolvimento local e satisfaz o Vite com folga.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # vitest run — a suíte de unidade (catálogo i18n, impacto, agendamento).
      - run: npm test

      # tsc -b && vite build — type-check + bundle de produção.
      - run: npm run build
